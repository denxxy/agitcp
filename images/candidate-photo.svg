<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112576"/>
      <stop offset="100%" stop-color="#0b1747"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#112576" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Фон -->
  <rect width="400" height="480" fill="url(#bgGrad)"/>
  <rect width="400" height="480" fill="url(#glowGrad)"/>

  <!-- Силуэт кандидата в деловом стиле -->
  <g transform="translate(0, 40)">
    <!-- Торс / Плечи -->
    <path d="M100 380 C100 300, 140 260, 200 260 C260 260, 300 300, 300 380 Z" fill="#1e3a8a"/>
    <path d="M120 380 C120 320, 150 280, 200 280 C250 280, 280 320, 280 380 Z" fill="url(#avatarGrad)"/>
    
    <!-- Воротник рубашки / галстук -->
    <polygon points="175,280 200,340 225,280 200,290" fill="#ffffff"/>
    <polygon points="194,300 206,300 203,370 197,370" fill="#ea580c"/>

    <!-- Шея -->
    <rect x="182" y="220" width="36" height="65" rx="8" fill="#e2e8f0"/>

    <!-- Голова -->
    <ellipse cx="200" cy="180" rx="55" ry="68" fill="#f1f5f9"/>
    
    <!-- Прическа -->
    <path d="M145 170 C140 120, 170 105, 200 105 C235 105, 260 120, 255 170 C250 135, 230 120, 200 120 C170 120, 150 135, 145 170 Z" fill="#0f172a"/>
  </g>

  <!-- Интерактивная плашка-подсказка: Нажмите, чтобы загрузить фото -->
  <rect x="30" y="390" width="340" height="60" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
  <g transform="translate(50, 405)">
    <!-- Иконка камеры -->
    <path d="M10 6 L14 2 L22 2 L26 6 L32 6 C34 6 36 8 36 10 L36 26 C36 28 34 30 32 30 L4 30 C2 30 0 28 0 26 L0 10 C0 8 2 6 4 6 Z" fill="#38bdf8"/>
    <circle cx="18" cy="18" r="6" fill="#0f172a"/>
    <circle cx="18" cy="18" r="3" fill="#ffffff"/>
  </g>
  <text x="100" y="420" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" letter-spacing="0.5">НАЖМИ, ЧТОБЫ ВСТАВИТЬ ФОТО</text>
  <text x="100" y="438" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11">или перетащи файл в эту область</text>
</svg>
